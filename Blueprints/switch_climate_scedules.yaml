blueprint:
  name: Person Presence - Switch Climate Schedules
  description: >
    Switches between comfort and away schedule switches for one specific climate
    unit, based on selected person entities.

    Designed for Mitsubishi AC / heat pump schedules where presets are not used.
    The blueprint does not directly set HVAC mode or temperature. It only enables
    the correct schedule set for the selected climate unit.

    Version: 202717-18

  domain: automation

  input:
    climate_unit:
      name: Climate unit
      description: The climate entity this schedule switching automation belongs to.
      selector:
        entity:
          domain: climate

    people:
      name: People linked to this climate unit
      description: >
        Select the person entities that should make this climate unit use its
        comfort schedule when they are home.
      selector:
        entity:
          domain: person
          multiple: true

    presence_rule:
      name: Presence rule
      description: >
        Choose whether comfort mode should be active when any selected person is
        home, or only when all selected people are home.
      default: any_selected_person_home
      selector:
        select:
          options:
            - label: Any selected person is home
              value: any_selected_person_home
            - label: All selected people are home
              value: all_selected_people_home

    comfort_schedules:
      name: Comfort schedule switches
      description: >
        Schedule switch or switches to turn on when the selected person's condition
        is met.
      selector:
        target:
          entity:
            domain: switch

    away_schedules:
      name: Away schedule switches
      description: >
        Schedule switch or switches to turn on when the selected person's condition
        is not met.
      selector:
        target:
          entity:
            domain: switch

    turn_off_inactive_schedules:
      name: Turn off inactive schedule set
      description: >
        If enabled, away schedules are turned off when comfort is active, and
        comfort schedules are turned off when away is active.
      default: true
      selector:
        boolean:

    require_climate_available:
      name: Require climate unit to be available
      description: >
        If enabled, the automation will not switch schedules while the selected
        climate entity is unavailable or unknown.
      default: true
      selector:
        boolean:

    settle_delay:
      name: Presence settle delay
      description: >
        Delay before switching schedules. Useful to avoid GPS or tracker flapping.
      default:
        hours: 0
        minutes: 0
        seconds: 30
      selector:
        duration:

    comfort_extra_actions:
      name: Extra actions when comfort schedules are enabled
      description: >
        Optional. For example, call your Mitsubishi group HVAC sync script.
        The variable climate_entity is available inside templates.
      default: []
      selector:
        action:

    away_extra_actions:
      name: Extra actions when away schedules are enabled
      description: >
        Optional. For example, call your Mitsubishi group HVAC sync script.
        The variable climate_entity is available inside templates.
      default: []
      selector:
        action:

mode: restart

variables:
  climate_entity: !input climate_unit
  people_entities: !input people
  presence_rule_value: !input presence_rule
  turn_off_inactive: !input turn_off_inactive_schedules
  require_climate: !input require_climate_available

  selected_people_count: >-
    {{ expand(people_entities) | list | count }}

  home_people_count: >-
    {{ expand(people_entities)
       | selectattr('state', 'eq', 'home')
       | list
       | count }}

  climate_is_available: >-
    {{ states(climate_entity) not in ['unknown', 'unavailable', 'none', ''] }}

  use_comfort_schedules: >-
    {% if presence_rule_value == 'all_selected_people_home' %}
      {{ selected_people_count | int(0) > 0 and home_people_count | int(0) == selected_people_count | int(0) }}
    {% else %}
      {{ home_people_count | int(0) > 0 }}
    {% endif %}

triggers:
  - trigger: homeassistant
    event: start

  - trigger: state
    entity_id: !input people

  - trigger: state
    entity_id: !input climate_unit
    from:
      - "unknown"
      - "unavailable"

actions:
  - delay: !input settle_delay

  - condition: template
    value_template: >-
      {{ not require_climate | bool(false) or climate_is_available | bool(false) }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ use_comfort_schedules | bool(false) }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ turn_off_inactive | bool(false) }}"
            then:
              - action: switch.turn_off
                target: !input away_schedules

          - action: switch.turn_on
            target: !input comfort_schedules

          - sequence: !input comfort_extra_actions

    default:
      - if:
          - condition: template
            value_template: "{{ turn_off_inactive | bool(false) }}"
        then:
          - action: switch.turn_off
            target: !input comfort_schedules

      - action: switch.turn_on
        target: !input away_schedules

      - sequence: !input away_extra_actions
