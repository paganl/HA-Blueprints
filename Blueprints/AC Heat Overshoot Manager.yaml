blueprint:
  name: A/C Overshoot and Undershoot Sleep Manager
  description: >
    Monitors a climate entity using its current_temperature attribute.

    In heat mode:
      If current_temperature is above the heating setpoint by the configured
      overshoot amount, the unit is turned off for a delay based on outside
      temperature.

    In cool mode:
      If current_temperature is below the low setpoint by the configured
      undershoot amount, the unit is turned off for a delay based on outside
      temperature.

    If the unit is in heat mode and both the current temperature and outside
    temperature are above the cooling switch temperature, the unit switches
    to cooling instead of sleeping.

    Designed for Home Assistant 2026.5+ using actions/triggers syntax.

    Version: 202605-04
    
  domain: automation
  author: P Gale & ChatGPT
  homeassistant:
    min_version: 2026.5.0

  input:
    climate_entity:
      name: A/C climate entity
      selector:
        entity:
          filter:
            - domain: climate

    outside_temperature_sensor:
      name: Outside temperature sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    heat_overshoot_delta:
      name: Heat overshoot amount
      description: >
        In heat mode, turn the unit off when current_temperature is this many
        degrees above the heating setpoint.
      default: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.1
          mode: box
          unit_of_measurement: "°"

    cool_undershoot_delta:
      name: Cool undershoot amount
      description: >
        In cool mode, turn the unit off when current_temperature is this many
        degrees below target_temp_low.
      default: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.1
          mode: box
          unit_of_measurement: "°"

    cool_max_temp:
      name: Cooling switch temperature
      description: >
        If the unit is heating and both current_temperature and outside
        temperature are at or above this value, switch to cooling.
      default: 26
      selector:
        number:
          min: 10
          max: 40
          step: 0.5
          mode: box
          unit_of_measurement: "°"

    outside_cold_temp:
      name: Outside cold threshold
      description: Below this outside temperature, use the short sleep time.
      default: 5
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          mode: box
          unit_of_measurement: "°"

    outside_mild_temp:
      name: Outside mild threshold
      description: >
        Between cold and mild threshold, use the medium sleep time.
        At or above this value, use the warm sleep time.
      default: 15
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          mode: box
          unit_of_measurement: "°"

    off_minutes_cold:
      name: Sleep minutes when outside is cold
      default: 5
      selector:
        number:
          min: 1
          max: 180
          step: 1
          mode: box
          unit_of_measurement: min

    off_minutes_mild:
      name: Sleep minutes when outside is mild
      default: 10
      selector:
        number:
          min: 1
          max: 180
          step: 1
          mode: box
          unit_of_measurement: min

    off_minutes_warm:
      name: Sleep minutes when outside is warm
      default: 20
      selector:
        number:
          min: 1
          max: 180
          step: 1
          mode: box
          unit_of_measurement: min

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input climate_entity

  - trigger: state
    entity_id: !input climate_entity
    attribute: current_temperature

  - trigger: state
    entity_id: !input climate_entity
    attribute: temperature

  - trigger: state
    entity_id: !input climate_entity
    attribute: target_temp_low

  - trigger: state
    entity_id: !input climate_entity
    attribute: target_temp_high

  - trigger: state
    entity_id: !input outside_temperature_sensor

  - trigger: time_pattern
    minutes: "/5"

variables:
  ac: !input climate_entity
  outside_sensor: !input outside_temperature_sensor

  heat_overshoot_delta: !input heat_overshoot_delta
  cool_undershoot_delta: !input cool_undershoot_delta
  cool_max_temp: !input cool_max_temp

  outside_cold_temp: !input outside_cold_temp
  outside_mild_temp: !input outside_mild_temp
  off_minutes_cold: !input off_minutes_cold
  off_minutes_mild: !input off_minutes_mild
  off_minutes_warm: !input off_minutes_warm

actions:
  - variables:
      current_temp: "{{ state_attr(ac, 'current_temperature') | float(none) }}"
      outside_temp: "{{ states(outside_sensor) | float(none) }}"

      heat_target_temp: >-
        {% set low = state_attr(ac, 'target_temp_low') | float(none) %}
        {% set target = state_attr(ac, 'temperature') | float(none) %}
        {% if low is not none %}
          {{ low }}
        {% elif target is not none %}
          {{ target }}
        {% else %}
          {{ none }}
        {% endif %}

      cool_low_temp: >-
        {% set low = state_attr(ac, 'target_temp_low') | float(none) %}
        {% set target = state_attr(ac, 'temperature') | float(none) %}
        {% if low is not none %}
          {{ low }}
        {% elif target is not none %}
          {{ target }}
        {% else %}
          {{ none }}
        {% endif %}

      cool_high_temp: >-
        {% set high = state_attr(ac, 'target_temp_high') | float(none) %}
        {% set target = state_attr(ac, 'temperature') | float(none) %}
        {% if high is not none %}
          {{ high }}
        {% elif target is not none %}
          {{ target }}
        {% else %}
          {{ cool_max_temp | float }}
        {% endif %}

      off_minutes_now: >-
        {% set out = states(outside_sensor) | float(none) %}
        {% if out is none %}
          {{ off_minutes_mild | int }}
        {% elif out < (outside_cold_temp | float) %}
          {{ off_minutes_cold | int }}
        {% elif out < (outside_mild_temp | float) %}
          {{ off_minutes_mild | int }}
        {% else %}
          {{ off_minutes_warm | int }}
        {% endif %}

  - choose:
      - alias: Heat mode - switch to cooling when both inside and outside are hot
        conditions:
          - condition: template
            value_template: >-
              {% set room = current_temp | float(none) %}
              {% set outside = outside_temp | float(none) %}
              {{
                is_state(ac, 'heat')
                and room is not none
                and outside is not none
                and room >= (cool_max_temp | float)
                and outside >= (cool_max_temp | float)
              }}
        sequence:
          - variables:
              cool_target_now: >-
                {% set high = state_attr(ac, 'target_temp_high') | float(none) %}
                {% set target = state_attr(ac, 'temperature') | float(none) %}
                {% if high is not none %}
                  {{ high }}
                {% elif target is not none %}
                  {{ target }}
                {% else %}
                  {{ cool_max_temp | float }}
                {% endif %}

          - action: climate.set_temperature
            continue_on_error: true
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: cool
              temperature: "{{ cool_target_now | float }}"

      - alias: Heat mode - sleep when current temperature is above heat target
        conditions:
          - condition: template
            value_template: >-
              {% set room = current_temp | float(none) %}
              {% set heat_target = heat_target_temp | float(none) %}
              {{
                is_state(ac, 'heat')
                and room is not none
                and heat_target is not none
                and room >= (heat_target + (heat_overshoot_delta | float))
              }}
        sequence:
          - action: climate.turn_off
            continue_on_error: true
            target:
              entity_id: !input climate_entity

          - delay:
              minutes: "{{ off_minutes_now | int }}"

          - choose:
              - alias: After heat sleep, switch to cooling if still hot inside and outside
                conditions:
                  - condition: template
                    value_template: >-
                      {% set room = state_attr(ac, 'current_temperature') | float(none) %}
                      {% set outside = states(outside_sensor) | float(none) %}
                      {{
                        is_state(ac, 'off')
                        and room is not none
                        and outside is not none
                        and room >= (cool_max_temp | float)
                        and outside >= (cool_max_temp | float)
                      }}
                sequence:
                  - variables:
                      cool_target_now: >-
                        {% set high = state_attr(ac, 'target_temp_high') | float(none) %}
                        {% set target = state_attr(ac, 'temperature') | float(none) %}
                        {% if high is not none %}
                          {{ high }}
                        {% elif target is not none %}
                          {{ target }}
                        {% else %}
                          {{ cool_max_temp | float }}
                        {% endif %}

                  - action: climate.set_temperature
                    continue_on_error: true
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: cool
                      temperature: "{{ cool_target_now | float }}"

              - alias: After heat sleep, restore heat if still off
                conditions:
                  - condition: template
                    value_template: "{{ is_state(ac, 'off') }}"
                sequence:
                  - variables:
                      heat_target_now: >-
                        {% set low = state_attr(ac, 'target_temp_low') | float(none) %}
                        {% set target = state_attr(ac, 'temperature') | float(none) %}
                        {% if low is not none %}
                          {{ low }}
                        {% elif target is not none %}
                          {{ target }}
                        {% else %}
                          {{ heat_target_temp | float }}
                        {% endif %}

                  - action: climate.set_temperature
                    continue_on_error: true
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: heat
                      temperature: "{{ heat_target_now | float }}"

      - alias: Cool mode - sleep when current temperature is below low target
        conditions:
          - condition: template
            value_template: >-
              {% set room = current_temp | float(none) %}
              {% set cool_low = cool_low_temp | float(none) %}
              {{
                is_state(ac, 'cool')
                and room is not none
                and cool_low is not none
                and room <= (cool_low - (cool_undershoot_delta | float))
              }}
        sequence:
          - action: climate.turn_off
            continue_on_error: true
            target:
              entity_id: !input climate_entity

          - delay:
              minutes: "{{ off_minutes_now | int }}"

          - choose:
              - alias: After cool sleep, restore cool if still off
                conditions:
                  - condition: template
                    value_template: "{{ is_state(ac, 'off') }}"
                sequence:
                  - variables:
                      cool_target_now: >-
                        {% set high = state_attr(ac, 'target_temp_high') | float(none) %}
                        {% set target = state_attr(ac, 'temperature') | float(none) %}
                        {% if high is not none %}
                          {{ high }}
                        {% elif target is not none %}
                          {{ target }}
                        {% else %}
                          {{ cool_high_temp | float }}
                        {% endif %}

                  - action: climate.set_temperature
                    continue_on_error: true
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: cool
                      temperature: "{{ cool_target_now | float }}"
