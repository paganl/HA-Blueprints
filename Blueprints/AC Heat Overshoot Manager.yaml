blueprint:
  name: A/C Dual Setpoint Sleep Manager
  description: >
    Sleep manager for dual-setpoint climate entities such as Mitsubishi CN105
    devices that expose current_temperature, target_temp_low, and
    target_temp_high, but no temperature attribute.

    Heat mode:
      If current_temperature is at least X degrees above target_temp_low,
      turn the unit off for a calculated sleep period, then restore heat.

    Cool mode:
      If current_temperature is at least X degrees below target_temp_low,
      turn the unit off for a calculated sleep period, then restore cool.

    Heat to cool:
      If the unit is in heat mode and both current_temperature and outside
      temperature are at or above the cooling switch temperature, switch to
      cool mode.

    This blueprint uses climate.set_hvac_mode to preserve the device's existing
    target_temp_low and target_temp_high values.

    Version: 202605-08
    
  domain: automation
  author: ChatGPT
  homeassistant:
    min_version: 2026.5.0

  input:
    climate_entity:
      name: A/C climate entity
      selector:
        entity:
          filter:
            - domain: climate

    outside_temperature_sensor:
      name: Outside temperature sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    heat_overshoot_delta:
      name: Heat overshoot amount
      description: >
        In heat mode, sleep when current_temperature is this many degrees
        above target_temp_low.
      default: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.1
          mode: box
          unit_of_measurement: "°"

    cool_undershoot_delta:
      name: Cool undershoot amount
      description: >
        In cool mode, sleep when current_temperature is this many degrees
        below target_temp_low.
      default: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.1
          mode: box
          unit_of_measurement: "°"

    cool_switch_temp:
      name: Cooling switch temperature
      description: >
        If the unit is heating and both current_temperature and outside
        temperature are at or above this value, switch to cooling.
      default: 26
      selector:
        number:
          min: 10
          max: 40
          step: 0.5
          mode: box
          unit_of_measurement: "°"

    outside_cold_temp:
      name: Outside cold threshold
      description: Below this outside temperature, use the cold sleep time.
      default: 5
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          mode: box
          unit_of_measurement: "°"

    outside_mild_temp:
      name: Outside mild threshold
      description: >
        Between the cold and mild thresholds, use the mild sleep time.
        At or above this value, use the warm sleep time.
      default: 15
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          mode: box
          unit_of_measurement: "°"

    off_minutes_cold:
      name: Sleep minutes when outside is cold
      default: 10
      selector:
        number:
          min: 1
          max: 180
          step: 1
          mode: box
          unit_of_measurement: min

    off_minutes_mild:
      name: Sleep minutes when outside is mild
      default: 20
      selector:
        number:
          min: 1
          max: 180
          step: 1
          mode: box
          unit_of_measurement: min

    off_minutes_warm:
      name: Sleep minutes when outside is warm
      default: 60
      selector:
        number:
          min: 1
          max: 240
          step: 1
          mode: box
          unit_of_measurement: min

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input climate_entity

  - trigger: state
    entity_id: !input climate_entity
    attribute: current_temperature

  - trigger: state
    entity_id: !input climate_entity
    attribute: target_temp_low

  - trigger: state
    entity_id: !input climate_entity
    attribute: target_temp_high

  - trigger: state
    entity_id: !input outside_temperature_sensor

  - trigger: time_pattern
    minutes: "/5"

variables:
  ac: !input climate_entity
  outside_sensor: !input outside_temperature_sensor

  heat_overshoot_delta: !input heat_overshoot_delta
  cool_undershoot_delta: !input cool_undershoot_delta
  cool_switch_temp: !input cool_switch_temp

  outside_cold_temp: !input outside_cold_temp
  outside_mild_temp: !input outside_mild_temp
  off_minutes_cold: !input off_minutes_cold
  off_minutes_mild: !input off_minutes_mild
  off_minutes_warm: !input off_minutes_warm

actions:
  - variables:
      current_temp: "{{ state_attr(ac, 'current_temperature') | float(none) }}"
      low_target_temp: "{{ state_attr(ac, 'target_temp_low') | float(none) }}"
      high_target_temp: "{{ state_attr(ac, 'target_temp_high') | float(none) }}"
      outside_temp: "{{ states(outside_sensor) | float(none) }}"

      off_minutes_now: >-
        {% set out = states(outside_sensor) | float(none) %}
        {% if out is none %}
          {{ off_minutes_mild | int }}
        {% elif out < (outside_cold_temp | float) %}
          {{ off_minutes_cold | int }}
        {% elif out < (outside_mild_temp | float) %}
          {{ off_minutes_mild | int }}
        {% else %}
          {{ off_minutes_warm | int }}
        {% endif %}

  - choose:
      - alias: Heat mode - switch to cooling when inside and outside are hot
        conditions:
          - condition: template
            value_template: >-
              {% set room = current_temp | float(none) %}
              {% set outside = outside_temp | float(none) %}
              {{
                is_state(ac, 'heat')
                and room is not none
                and outside is not none
                and room >= (cool_switch_temp | float)
                and outside >= (cool_switch_temp | float)
              }}
        sequence:
          - action: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: cool

      - alias: Heat mode - sleep when current temperature is above low target
        conditions:
          - condition: template
            value_template: >-
              {% set room = current_temp | float(none) %}
              {% set low = low_target_temp | float(none) %}
              {{
                is_state(ac, 'heat')
                and room is not none
                and low is not none
                and room >= (low + (heat_overshoot_delta | float))
              }}
        sequence:
          - action: climate.turn_off
            continue_on_error: true
            target:
              entity_id: !input climate_entity

          - delay:
              minutes: "{{ off_minutes_now | int }}"

          - choose:
              - alias: After heat sleep, switch to cooling if still hot inside and outside
                conditions:
                  - condition: template
                    value_template: >-
                      {% set room = state_attr(ac, 'current_temperature') | float(none) %}
                      {% set outside = states(outside_sensor) | float(none) %}
                      {{
                        is_state(ac, 'off')
                        and room is not none
                        and outside is not none
                        and room >= (cool_switch_temp | float)
                        and outside >= (cool_switch_temp | float)
                      }}
                sequence:
                  - action: climate.set_hvac_mode
                    continue_on_error: true
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: cool

              - alias: After heat sleep, restore heat if still off
                conditions:
                  - condition: template
                    value_template: "{{ is_state(ac, 'off') }}"
                sequence:
                  - action: climate.set_hvac_mode
                    continue_on_error: true
                    target:
                      entity_id: !input climate_entity
                    data:
                      hvac_mode: heat
                      
      - alias: Cool mode - sleep when current temperature is below high target
        conditions:
          - condition: template
            value_template: >-
              {% set room = current_temp | float(none) %}
              {% set high = high_target_temp | float(none) %}
              {{
                is_state(ac, 'cool')
                and room is not none
                and high is not none
                and room <= (high - (cool_undershoot_delta | float))
              }}
        sequence:
          - action: climate.turn_off
            continue_on_error: true
            target:
              entity_id: climate.mitsubishi_ac_office_mitsubishi_ac_office_climate
      
          - delay:
              minutes: "{{ off_minutes_now | int }}"
      
          - choose:
              - alias: After cool sleep, restore cool if still off
                conditions:
                  - condition: template
                    value_template: "{{ is_state(ac, 'off') }}"
                sequence:
                  - action: climate.set_hvac_mode
                    continue_on_error: true
                    target:
                      entity_id: climate.mitsubishi_ac_office_mitsubishi_ac_office_climate
                    data:
                      hvac_mode: cool
